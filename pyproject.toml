[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-tool-router"
version = "0.2.0"
description = "Self-hostable MCP proxy that retrieves only the top-k relevant tools per query."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Sneha Khoreja", email = "snehakhoreja1710@gmail.com" }]
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "numpy>=1.24",
    "pyyaml>=6.0",
    "mcp>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]
# The v0.2 default embedder. Install for semantic retrieval; omit and set
# MCP_ROUTER_EMBEDDER=hashing to run fully offline.
semantic = ["sentence-transformers>=2.2"]

[project.scripts]
mcp-tool-router = "mcp_router.mcp_server:main"

[tool.setuptools]
packages = ["mcp_router"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
